      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Больно ли делать лазерную эпиляцию?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "На MAGIC Lite наконечник с сапфировым охлаждением контактирует с кожей, поэтому ощущения — тёплые вспышки и холод. Мастер подбирает параметры под ваш фототип и чувствительность зоны. Максимальный комфорт — приоритет процедуры."
            }
          },
          {
            "@type": "Question",
            "name": "Сколько нужно процедур лазерной эпиляции?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Обычно курс 6–10 процедур с интервалом 4–6 недель: лазер действует на волосы в активной фазе роста. Заметное сокращение волос — уже после первых сеансов, точный план мастер составляет на консультации."
            }
          },
          {
            "@type": "Question",
            "name": "Можно ли делать лазерную эпиляцию на загорелой коже?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Диодный лазер 808 нм работает с широким диапазоном фототипов (I–VI), включая смуглую кожу. Но свежий загар — ограничение: перед процедурой лучше избегать активного солнца 10–14 дней, а решение принимает мастер на консультации."
            }
          },
          {
            "@type": "Question",
            "name": "Чем криолиполиз отличается от кавитации?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Криолиполиз Coolplas — локальное контролируемое охлаждение (-5…-8 °C), за сеанс до 4 зон одновременно, результат нарастает 1–3 месяца. Кавитация CAVISM — ультразвук плюс Tripolar RF: динамика заметна после 1–3 сеансов, RF подтягивает кожу. Схему сочетания определяет мастер."
            }
          },
          {
            "@type": "Question",
            "name": "Есть ли рассрочка?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Да, доступна беспроцентная рассрочка до 3 месяцев. Также действует акция «любая зона 799 ₽ при покупке абонемента»."
            }
          },
          {
            "@type": "Question",
            "name": "Как вас найти?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Адлер, ул. Кирова, 36Б — 2 этаж, кабинет 24. Ежедневно с 10:00 до 20:00. Телефон и WhatsApp: +7 999 055-59-00."
            }
          }
        ]
      }

ся с криолиполизом"}],note:"Подходящую схему сочетания определяет мастер на консультации."}],Xx=[{icon:"user",title:"Лично мастер",text:"Каждую процедуру проводит Анжелика Алибекова — от консультации до последнего импульса."},{icon:"sliders",title:"Параметры под вас",text:"Консультация перед процедурой: фототип, толщина волоса, чувствительность зоны — и индивидуальный режим."},{icon:"shield",title:"Стерильность",text:"Дезинфекция, стерилизация и одноразовые материалы на каждой процедуре."},{icon:"spark",title:"MAGIC Lite™",text:"Диодный лазер нового поколения с сапфировым охлаждением — комфортно и быстро."},{icon:"star",title:"Рейтинг 5.0",text:"5.0 на Zoon и 4.8 на Авито (~47 отзывов). Люди возвращаются и приводят подруг."},{icon:"pin",title:"Центр Адлера",text:"ул. Кирова, 36Б — 2 этаж, кабинет 24. Уютная студия, ежедневно 10:00–20:00."}],dl=[{id:"r1",type:"quote",text:"Уже почти два года посещаю лазерную эпиляцию у мастера Анжелики… идеальная чистота",author:"Отзыв клиента",source:"Фламп",url:_.gis2},{id:"r2",type:"quote",text:"Процедуру провели аккуратно и без дискомфорта…",author:"Отзыв клиента",source:"2ГИС",url:_.gis2},{id:"r3",type:"rating",value:"5.0",scale:"из 5",platform:"Zoon",text:"Оценка студии лазерной эпиляции MAGIC STUDIO на площадке Zoon.",url:_.zoon},{id:"r4",type:"rating",value:"4.8",scale:"из 5 · ~47 отзывов",platform:"Авито",text:"Рейтинг мастера на Авито по отзывам клиентов.",url:_.gis2},{id:"r5",type:"rating",value:"Карточка",scale:"организации",platform:"Яндекс.Карты",text:"Адрес, режим работы, маршрут и отзывы о студии на Яндекс.Картах.",url:_.yandex},{id:"r6",type:"rating",value:"2ГИС",scale:"Сочи · Адлер",platform:"2ГИС",text:"Карточка организации, отзывы и маршрут до студии.",url:_.gis2}],At={name:"Алибекова Анжелика Карапетовна",role:"Мастер лазерной эпиляции и аппаратной косметологии",initials:"АА",photo:Ce(16),photoRatio:"4/5",photoPos:"56% 26%",photoAlt:"Анжелика Алибекова в белом халате у аппарата MAGIC Lite в студии",photoCredit:"Анжелика и аппарат MAGIC Lite™ · фото: Magic Studio",intro:"Каждую процедуру в MAGIC STUDIO проводит лично Анжелика: консультация до процедуры, подбор параметров под клиента, стерилизация, дезинфекция и одноразовые материалы. Никакой «потоковой» передачи клиента другому специалисту.",principles:["Консультация перед каждой процедурой — без неё параметры не настраиваются","Индивидуальный подбор мощности и импульса под фототип и зону","Дезинфекция, стерилизация и одноразовые материалы","Честный прогноз: сколько процедур нужно именно вам"],education:[{year:"2020",title:"Сертификат Melsytech",detail:"Обучение по применению технологий лазерной эпиляции на системе MAGIC Lite™ (21.10.2020)"},{year:"2021",title:"«Аппаратное удаление волос»",detail:"LLC Contour Line, Москва (18.10.2021)"},{year:"2023",title:"Диплом «Косметик-эстетист»",detail:"Профессиональная переподготовка, 50 ч, УЦ «Космо.Проф», г. Люберцы"},{year:"2023",title:"Диплом «Коррекция фигуры методами аппаратной косметологии»",detail:"Профессиональная переподготовка, 50 ч, «Космо.Проф»"},{year:"2023",title:"«Медицинская сестра по уходу за больными»",detail:"Свидетельство о присвоении квалификации, 250 ч"},{year:"2024",title:"Диплом «Аппаратное удаление волос»",detail:"Профессиональная переподготовка, «Космо.Проф»"}],docsNote:"УТОЧНИТЬ у заказчика: публиковать ли сканы дипломов в свитч-галерее «Документы». Фото дипломов переданы в материалах студии."},tm=[{q:"Больно ли делать лазерную эпиляцию?",a:"Максимальный комфорт — приоритет процедуры: наконечник MAGIC Lite™ с сапфировым охлаждением контактирует с кожей, поэтому вы чувствуете холод и короткие тёплые вспышки. Мастер подбирает параметры под ваш фототип и чувствительность зоны, а в особо чувствительных зонах делает паузы. Если где-то дискомфортнее, чем ожидали, — скажите, параметры скорректируют."},{q:"Сколько нужно процедур и как часто?",a:"Обычно курс 6–10 процедур с интервалом 4–6 недель: лазер действует на волосы в активной фазе роста, а фазы у волос разные. Заметное сокращение волос — уже после первых сеансов, дальше эффект нарастает. Точный план Анжелика составляет на консультации, исходя из зоны, фототипа и плотности роста."},{q:"Можно ли делать процедуру на загорелой коже?",a:"Диодный лазер 808 нм работает с широким диапазоном фототипов (I–VI), включая смуглую кожу. Но свежий интенсивный загар — ограничение: за 10–14 дней до процедуры лучше избегать активного солнца и солярия, не использовать автозагар. Окончательное решение принимает мастер на консультации."},{q:"Как подготовиться к лазерной эпиляции?",a:"За 1–2 дня сбрейте волосы в зоне (или за 3–4 дня для жёстких волос), чтобы к моменту процедуры была короткая щетина. Не используйте кремы-депиляторы, воск и электроэпилятор между процедурами — волос должен сохранить корень. В день процедуры не наносите на зону кремы, масла и автозагар."},{q:"Какой уход нужен после процедуры?",a:"SPF 30–50 на открытые зоны, 24–48 часов без горячих процедур (баня, сауна, горячая ванна, интенсивный спорт), не скрабировать зону. Оставшиеся волоски выпадают в течение 10–14 дней — это нормально. Между процедурами допустимо только бритьё."},{q:"Чем криолиполиз отличается от кавитации?",a:"Криолиполиз Coolplas™ — локальное контролируемое охлаждение (-5…-8 °C), до 4 зон за сеанс, результат нарастает 1–3 месяца. Кавитация CAVISM™ — ультразвук плюс Tripolar RF: динамика заметна после 1–3 сеансов, RF подтягивает кожу. Часто их комбинируют: криолиполиз для объёмных зон и кавитация для динамики. Подходящую схему определяет мастер на консультации."},{q:"Это метод похудения?",a:"Нет. Криолиполиз и кавитация — коррекция локальных зон при нормальном ИМТ: они работают с «упрямыми» отложениями, которые не уходят от диеты и спорта. Мы честно скажем на консультации, если задача решается иначе."},{q:"Сколько стоит и есть ли рассрочка?",a:`Отдельные зоны — от ${ge.zones[0].price} ₽, комплексы — от ${ge.packages[0].price} ₽ (${ge.packages[0].name}), действует акция «любая зона ${ge.promo.anyZoneAbonement} ₽ при покупке абонемента». Доступна беспроцентная рассрочка до 3 месяцев. Точную сумму набора зон посчитает конструктор программы на этой странице.`},{q:"Как вас найти и нужна ли запись?",a:`Адлер, ${_.address}. ${_.hours}. Запись по телефону ${_.phoneHuman} или в WhatsApp — так мы гарантируем, что процедура пройдёт без ожидания. Приходите за 5 минут до времени: заполним анкету и проведём консультацию.`},{q:"Есть ли противопоказания?",a:"Да: беременность и период лактации, онкологические заболевания, эпилепсия, свежий загар, активные инфекции и воспаления в зоне воздействия, декомпенсированный сахарный диабет, татуаж в зоне обработки. Полный список — в разделе «Правила оказания услуг», уточнение всегда на консультации у мастера."}],Vx=[{file:"hero-видео (фон)",source:"Pexels",author:"Gustavo Fring",license:"Pexels License (free)",url:"https://www.pexels.com/video/woman-having-a-facial-treatment-7423538/"},{file:"видео «как проходит процедура»",source:"Pexels",author:"olia danilevich",license:"Pexels License (free)",url:"https://www.pexels.com/video/person-massaging-the-face-of-a-woman-9335800/"},{file:"service-laser (лазерная эпиляция)",source:"Pexels",author:"Larysa Stratiichuk",license:"Pexels License (free)",url:"https://www.pexels.com/photo/35103882/"},{file:"service-cryo (криолиполиз)",source:"Pexels",author:"Lespa",license:"Pexels License (free)",url:"https://www.pexels.com/photo/5042610/"},{file:"service-cavi (кавитация)",source:"Pexels",author:"Dmitry Ovsyannikov",license:"Pexels License (free)",url:"https://www.pexels.com/photo/27659253/"},{file:"запасной портрет в блоке «Мастер» (фолбэк, если CDN студии недоступен)",source:"Pexels",author:"Antoni Shkraba",license:"Pexels License (free)",url:"https://www.pexels.com/photo/a-doctor-holding-a-clipboard-5215024/"},{file:"аппарат MAGIC Lite™ в блоке «Наш парк»",source:"Pexels",author:"Pavel Danilyuk",license:"Pexels License (free)",url:"https://www.pexels.com/photo/a-gray-medical-equipment-7108123/"},{file:"ап номер телефона;","адрес электронной почты (если указан);","выбранные зоны, услуги, пакет, модули и итоговая программа;","удобные дата и время визита;","текст обращения в чате ассистента;","технические данные: user-agent, данные localStorage (тема, избранное, сравнение, черновик программы), cookie сервисов встраивания."]},{h:"3. Цели обработки",li:["запись на процедуру и подтверждение визита;","консультация по услугам, зонам и стоимости;","расчёт индивидуальной программы и подготовка коммерческого предложения;","обратная связь по обращению;","соблюдение требований законодательства РФ."]},{h:"4. Правовые основания",p:["Согласие субъекта персональных данных (ст. 6, 9 ФЗ-152), а также исполнение договорённости о записи и оказании эстетических услуг. Согласие подтверждается отметкой в форме и ссылкой на настоящий документ."]},{h:"5. Срок хранения и уничтожение",p:["Данные хранятся до достижения целей обработки либо до отзыва согласия. Черновик программы, избранное и сравнение хранятся локально в браузере пользователя и удаляются очисткой localStorage. После отзыва согласия данные прекращают обрабатываться и уничтожаются, за исключением случаев, когда обработка допускается законом."]},{h:"6. Права субъекта персональных данных",li:["получать сведения об обработке ваших данных;","требовать уточнения, блокирования или уничтожения данных;","отозвать согласие на обработку;","обжаловать действия Оператора в уполномоченный орган по защите прав субъектов ПД или в суд."]},{h:"7. Порядок отзыва согласия",p:[`Отзыв направляется любым способом, позволяющим подтвердить факт получения: на e-mail ${_.email}, в WhatsApp ${_.phoneHuman} или письменно по адресу студии: ${_.address}. В обращении укажите ФИО, контактный телефон и формулировку «отзываю согласие на обработку персональных данных».`]},{h:"8. Передача третьим лицам",p:["Оператор не продаёт и не передаёт персональные данные третьим лицам, кроме случаев, предусмотренных законом. Для связи с вами используются мессенджер WhatsApp (сервис Meta Platforms Inc.) и почтовый сервис — им передаётся только текст вашего обращения и контактные данные, необходимые для ответа.","Сайт не использует рекламные трекеры и системы веб-аналитики."]},{h:"9. Cookie и встраиваемые сервисы",p:["Сайт применяет localStorage (избранное, сравнение, тема оформления, черновик программы) и может встраивать виджеты Instagram, Яндекс.Карт и 2ГИС. При загрузке таких виджетов соответствующий сервис может устанавливать собственные cookie согласно своей политике. Отключение cookie в браузере не мешает пользоваться сайтом, но обнулит сохранённые списки."]},{h:"10. Защита данных",p:["Оператор принимает организационные и технические меры: ограничение круга лиц с доступом, хранение обращений в защищённых каналах связи, отсутствие открытых ключей API в коде сайта."]},{h:"11. Контакты",p:[`E-mail: ${_.email}. Телефон / WhatsApp: ${_.phoneHuman}. Адрес: ${_.address}. Режим работы: ${_.hours}.`,Vt],note:_.hoursNote}]},{id:"consent",title:"Согласие на обработку персональных данных",updated:"редакция от 22.10.2026",lead:"Текст согласия, которое пользователь подтверждает отметкой в чекбоксе любой формы на сайте. Без отметки отправка формы заблокирована.",blocks:[{h:"Формулировка согласия",p:["Я, действуя своей волей и в своём интересе, даю согласие Оператору: "+is,"на обработку моих персональных данных на условиях, изложенных в Политике конфиденциальности."]},{h:"Перечень данных",li:["фамилия, имя;","номер телефона;","адрес электронной почты;","выбранные зоны, услуги и состав индивидуальной программы;","удобные дата и время визита;","содержание моего обращения."]},{h:"Перечень действий с данными",p:["сбор, запись, систематизация, накопление, хранение, уточнение (обновление, изменение), извлечение, использование, передача (предоставление, доступ) в объёме, необходимом для связи со мной, обезличивание, блокирование, удаление, уничтожение — с использованием средств автоматизации и без них."]},{h:"Цель обработки",p:["запись на процедуру, консультация по услугам и стоимости, подготовка индивидуального предложения, обратная связь по обращению."]},{h:"Срок действия и отзыв",p:[`Согласие действует до его отзыва. Отзыв направляется Оператору на e-mail ${_.email}, в WhatsApp ${_.phoneHuman} или письменно по адресу: ${_.address}. После получения отзыва обработка прекращается, данные уничтожаются, если иное не требуется законом.`]},{h:"Подтверждение",p:["Отметка чекбокса и отправка формы означают, что согласие дано свободно, сознательно и предметно, что указанные данные принадлежат мне и являются достоверными."]}]},{id:"offer",title:"Условия оказания услуг",updated:"редакция от 22.10.2026",lead:"Настоящий документ — единственная часть сайта, являющаяся публичной офертой в смысле ст. 437 ГК РФ. Остальные разделы носят информационный характер.",blocks:[{h:"1. Предмет",p:["Исполнитель — "+is+" — оказывает эстетические услуги: лазерную эпиляцию на аппарате MAGIC Lite™, криолиполиз на аппарате Coolplas™ и ультразвуковую кавитацию с Tripolar RF на аппарате CAVISM™. Услуги носят эстетический характер.","Заказчик — физическое лицо, достигшее 18 лет, обратившееся за услугой."]},{h:"2. Запись и порядок приёма",p:[`Запись осуществляется по телефону ${_.phoneHuman}, в WhatsApp, через форму на сайте либо лично в студии по адресу ${_.address}. Приём ведётся по записи: ${_.hours}.`,"Перед процедурой проводится консультация: оценивается фототип, состояние кожи, выявляются противопоказания, подбираются параметры. При наличии противопоказаний Исполнитель вправе отказать в услуге — это не является нарушением условий."]},{h:"3. Цена и оплата",p:["Стоимость определяется действующим прайсом (редакция от 22.10.2026) и зависит от зоны, группы зон или выбранного комплекса. Цены на криолиполиз и кавитацию определяются на консультации по количеству зон и схеме процедур.","Оплата производится в студии после консультации и до начала процедуры. Доступна беспроцентная рассрочка до 3 месяцев: сумма делится на равные части без процентов и переплат, график согласуется сторонами."]},{h:"4. Абонементы и акции",p:["Акция «любая зона 799 ₽ при покупке абонемента» действует при приобретении абонемента; актуальность и условия применения уточняйте при записи. Абонемент привязан к клиенту и не передаётся третьим лицам.","Скидки и акции не суммируются, если иное не указано в условиях конкретной акции."]},{h:"5. Отмена и перенос",p:["Отменить или перенести визит можно по телефону или в WhatsApp. Просим сообщать об этом заранее — минимум за 3 часа до назначенного времени, чтобы мы успели предложить окно другому клиенту.","При систематических опозданиях более 15 минут Исполнитель вправе сократить объём процедуры или перенести её на другое время по согласованию."]},{h:"6. Результат",p:["Результат зависит от индивидуальных особенностей: фототипа, цвета и толщины волоса, гормонального фона, соблюдения рекомендаций и количества процедур. Исполнитель не гарантирует и не обещает «100% результат навсегда». Рекомендуемый курс лазерной эпиляции — 6–10 процедур с интервалом 4–6 недель; результат криолиполиза нарастает в течение 1–3 месяцев.",Vt]},{h:"7. Ответственность сторон",p:["Исполнитель отвечает за качество услуги и соблюдение санитарных требований: дезинфекция, стерилизация, одноразовые материалы. Заказчик отвечает за достоверность сведений о состоянии здоровья и соблюдение рекомендаций до и после процедуры. При сокрытии противопоказаний ответственность за последствия лежит на Заказчике."]},{h:"8. Претензии",p:[`Претензии направляются на e-mail ${_.email} или письменно по адресу студии. Срок рассмотрения — до 10 рабочих дней. Споры разрешаются в порядке, предусмотренном Законом РФ «О защите прав потребителей».`]},{h:"9. Реквизиты",p:[is,`Адрес: ${_.address}. Телефон: ${_.phoneHuman}. E-mail: ${_.email}. Instagram: ${_.instagramName}.`],note:"Реквизиты заполняются после подтверждения организационно-правовой формы у заказчика."}]},{id:"rules",title:"Правила оказания услуг и памятки",updated:"редакция от 22.10.2026",lead:"Правила подготовлены с учётом Закона РФ «О защите прав потребителей» и Правил бытового обслуживания населения в Российской Федерации. Здесь же — памятки по подготовке и уходу.",blocks:[{h:"1. Общие правила",li:["Услуги оказываются лицам старше 18 лет. Клиентам младше 18 лет — только в присутствии законного представителя и с его письменного согласия.","Приём ведётся по предварительной записи; просим приходить за 5 минут до назначенного времени для заполнения анкеты.","Перед процедурой проводится консультация, выявляются противопоказания, подбираются параметры аппарата.","На процедуре используются одноразовые материалы, проводится дезинфекция и стерилизация.","В студии соблюдаются правила санитарного режима; клиент вправе попросить показать обработку инструмента и расходники.","Просим сообщать о любом дискомфорте во время процедуры — параметры будут скорректированы."]},{h:"2. Подготовка к лазерной эпиляции",li:["За 1–2 дня сбрейте волосы в зоне (для жёстких волос — за 3–4 дня), чтобы к процедуре была короткая щетина.","За 10–14 дней избегайте активного солнца и солярия, не используйте автозагар.","Между процедурами — только бритьё: воск, шугаринг и кремы-депиляторы удаляют корень, а лазеру нужен именно он.","В день процедуры не наносите на зону кремы, масла, лосьоны с кислотами и автозагар.","Приём фотосенсибилизирующих препаратов обязательно обсудите на консультации."]},{h:"3. Уход после лазерной эпиляции",li:["SPF 30–50 на открытые зоны в течение курса.","24–48 часов без бани, сауны, горячей ванны, интенсивного спорта и скрабов.","Оставшиеся волоски выпадают в течение 10–14 дней — это нормальная реакция.","Не выщипывайте и не выдирайте волоски между процедурами.","При выраженном покраснении или дискомфорте — свяжитесь с мастером."]},{h:"4. Криолиполиз и кавитация: подготовка и уход",li:["За 1–2 дня до сеанса — лёгкое питание, без алкоголя.","Питьевой режим: 1,5–2 литра воды в день, особенно в дни после кавитации — это помогает организму выводить продукты распада.","Лё
